<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Dados Pessoais</title>
</head>
<body>

    <form action="#" method="post">
        <fieldset>
            <legend><strong>DADOS PESSOAIS</strong></legend>

            <h3>IDENTIFICAÇÃO</h3>
            <p>
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome">
            </p>

            <p>
                <label>Nacionalidade:</label><br>
                <input type="radio" id="brasileira" name="nacionalidade" value="brasileira">
                <label for="brasileira">Brasileira</label>
                
                <input type="radio" id="estrangeira" name="nacionalidade" value="estrangeira">
                <label for="estrangeira">Estrangeira</label>
            </p>

            <p>
                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf">
            </p>

            <p>
                <label for="passaporte">Número Passaporte:</label><br>
                <input type="text" id="passaporte" name="passaporte">
            </p>

            <hr>

        <h3>DADOS DE NASCIMENTO</h3>
        <p>
            <label for="data_nascimento">Data:</label><br>
                <input type="date" id="data_nascimento" name="data_nascimento">
        </p>

         <p>
                <label for="pais_nascimento">País:</label><br>
                <select id="pais_nascimento" name="pais_nascimento">
                    <option value="">Selecione um país...</option>
                    <option value="Brasil">Brasil</option>
                    <option value="Argentina">Argentina</option>

     
                    <option value="Brasil">Brasil</option>
   
                    <option value="Colômbia">Colômbia</option>
                    
                  
                    <option value="Haiti">Haiti</option>

                    <option value="México">México</option>
                
                    <option value="Paraguai">Paraguai</option>
                    <option value="Peru">Peru</option>
    
                    <option value="Uruguai">Uruguai</option>
                    <option value="Venezuela">Venezuela</option>
                </select>
            </p>

            <p>
                <label for="uf_nascimento">UF:</label><br>
                <select id="uf_nascimento" name="uf_nascimento">
                    <option value="">Selecione a UF...</option>
                    <option value="PR">PR</option>
                    <option value="SP">SP</option>
                    <option value="RJ">RJ</option>
                    <option value="SC">SC</option>
                    <option value="RS">RS</option>
                    <option value="MG">MG</option>
                </select>
            </p>

            <p>
                <label for="cidade_nascimento">Cidade:</label><br>
                <input type="text" id="cidade_nascimento" name="cidade_nascimento">
            </p>

            <hr>

            <h3>SEXO</h3>
            <p>
                <input type="radio" id="feminino" name="sexo" value="feminino">
                <label for="feminino">Feminino</label>
                
                <input type="radio" id="masculino" name="sexo" value="masculino">
                <label for="masculino">Masculino</label>
            </p>

            <hr>

            <h3>IDENTIDADE</h3>
            <p>
                <label for="rg_numero">Número:</label><br>
                <input type="text" id="rg_numero" name="rg_numero">
            </p>

            <p>
                <label for="orgao_emissor">Órgão Emissor:</label><br>
                <input type="text" id="orgao_emissor" name="orgao_emissor">
            </p>

            <p>
                <label for="uf_rg">UF:</label><br>
                <select id="uf_rg" name="uf_rg">
                    <option value="">Selecione a UF...</option>
                    <option value="PR">PR</option>
                    <option value="SP">SP</option>
                    <option value="RJ">RJ</option>
                    <option value="SC">SC</option>
                    <option value="RS">RS</option>
                    <option value="MG">MG</option>
                </select>
            </p>

            <p>
                <label for="data_emissao_rg">Data:</label><br>
                <input type="date" id="data_emissao_rg" name="data_emissao_rg">
            </p>

            <hr>

            <h3>FILIAÇÃO</h3>
            <p>
                <label for="nome_pai">Nome do Pai:</label><br>
                <input type="text" id="nome_pai" name="nome_pai">
            </p>

            <p>
                <label for="nome_mae">Nome da Mãe:</label><br>
                <input type="text" id="nome_mae" name="nome_mae">
            </p>

            <br>

            <input type="submit" value="Salvar Dados">
            <input type="reset" value="Limpar Formulário">

        </fieldset>
    </form>

</body>
</html>
